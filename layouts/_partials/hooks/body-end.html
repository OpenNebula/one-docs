<script src="https://cdnjs.cloudflare.com/ajax/libs/medium-zoom/1.0.7/medium-zoom.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
const images = Array.from(document.querySelectorAll("img:not(.screencast-card__thumbnail)"));
images.forEach(img => {
  mediumZoom(img, {
    margin: 0, /* The space outside the zoomed image */
    scrollOffset: 40, /* The number of pixels to scroll to close the zoom */
    container: null, /* The viewport to render the zoom in */
    template: null /* The template element to display on zoom */
  });
});

document.addEventListener("click", event => {
  const preview = event.target.closest(".screencast-card__preview");
  if (!preview) return;
  event.preventDefault();

  const iframe = document.createElement("iframe");
  iframe.src = `https://www.youtube-nocookie.com/embed/${preview.dataset.videoId}?autoplay=1`;
  iframe.title = preview.dataset.videoTitle;
  iframe.referrerPolicy = "strict-origin-when-cross-origin";
  iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
  iframe.allowFullscreen = true;
  preview.replaceWith(iframe);
});

const homeBanner = document.querySelector(".docs-home-banner");

if (homeBanner) {
  window.addEventListener("pageshow", () => {
    homeBanner.classList.remove("is-leaving");
  });

  document.addEventListener("click", event => {
    const link = event.target.closest("a[href]");
    if (!link || event.defaultPrevented || event.button !== 0) return;
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    if (link.target && link.target !== "_self") return;
    if (link.hasAttribute("download")) return;

    const destination = new URL(link.href, window.location.href);
    const current = new URL(window.location.href);
    const isHttpNavigation = destination.protocol === "http:" || destination.protocol === "https:";
    const staysOnHomePage = destination.origin === current.origin && destination.pathname === current.pathname;

    if (!isHttpNavigation || staysOnHomePage) return;

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    event.preventDefault();
    homeBanner.classList.add("is-leaving");
    window.setTimeout(() => window.location.assign(destination.href), 180);
  });
}
</script>

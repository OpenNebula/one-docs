<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="560" fill="#1e1e1e"/>
<defs>
<marker id="a3b82f6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/></marker>
<marker id="a10b981" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#10b981"/></marker>
<marker id="af59e0b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/></marker>
<marker id="a9a9a9a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9a9a9a"/></marker>
</defs>
<rect x="20" y="60" width="860" height="50" rx="6" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8,5"/>
<text x="30" y="90" font-size="14" fill="#3b82f6">Management network: users reach the portal on 443, every role reaches OneGate and the internet</text>
<rect x="20" y="480" width="860" height="50" rx="6" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="8,5"/>
<text x="30" y="510" font-size="14" fill="#10b981">Compute network, reserved for the service: NFS, LDAP, SSH and the software cache between the roles</text>
<text x="80" y="35" text-anchor="middle" font-size="14" fill="#e6e6e6">Users, browser</text>
<line x1="80" y1="40" x2="80" y2="60" stroke="#3b82f6" stroke-width="2" marker-end="url(#a3b82f6)"/><text x="80.0" y="44.0" text-anchor="middle" font-size="12" fill="#e6e6e6"></text>
<text x="820" y="35" text-anchor="middle" font-size="14" fill="#e6e6e6">OneGate and OneFlow</text>
<line x1="820" y1="60" x2="820" y2="40" stroke="#3b82f6" stroke-width="2" marker-end="url(#a3b82f6)"/><text x="690" y="52" text-anchor="end" font-size="12" fill="#e6e6e6">READY, sessions, HEALTHY</text>
<rect x="40" y="160" width="260" height="170" rx="8" fill="#2a2a2a" stroke="#f59e0b" stroke-width="2"/>
<text x="170.0" y="184" text-anchor="middle" font-weight="bold" font-size="16" fill="#e6e6e6">portal, 1 VM</text>
<text x="170.0" y="206" text-anchor="middle" font-size="13" fill="#e6e6e6">Open OnDemand 4.2, Apache and Dex</text>
<text x="170.0" y="224" text-anchor="middle" font-size="13" fill="#e6e6e6">LDAP directory of the users</text>
<text x="170.0" y="242" text-anchor="middle" font-size="13" fill="#e6e6e6">dispatches sessions to the workers</text>
<text x="170.0" y="260" text-anchor="middle" font-size="13" fill="#e6e6e6">Prometheus metrics on 9101</text>
<rect x="330" y="160" width="240" height="170" rx="8" fill="#2a2a2a" stroke="#f59e0b" stroke-width="2"/>
<text x="450.0" y="184" text-anchor="middle" font-weight="bold" font-size="16" fill="#e6e6e6">storage, 1 VM</text>
<text x="450.0" y="206" text-anchor="middle" font-size="13" fill="#e6e6e6">NFS export of the shared home</text>
<text x="450.0" y="224" text-anchor="middle" font-size="13" fill="#e6e6e6">root only for the portal</text>
<text x="450.0" y="242" text-anchor="middle" font-size="13" fill="#e6e6e6">Squid cache for CernVM-FS</text>
<text x="450.0" y="260" text-anchor="middle" font-size="13" fill="#e6e6e6">optional persistent home disk</text>
<rect x="600" y="160" width="270" height="170" rx="8" fill="#2a2a2a" stroke="#f59e0b" stroke-width="2"/>
<text x="735.0" y="184" text-anchor="middle" font-weight="bold" font-size="16" fill="#e6e6e6">worker, 1 to 6 VMs, elastic</text>
<text x="735.0" y="206" text-anchor="middle" font-size="13" fill="#e6e6e6">one SSH login per session</text>
<text x="735.0" y="224" text-anchor="middle" font-size="13" fill="#e6e6e6">Apptainer container per session</text>
<text x="735.0" y="242" text-anchor="middle" font-size="13" fill="#e6e6e6">EESSI software from CernVM-FS</text>
<text x="735.0" y="260" text-anchor="middle" font-size="13" fill="#e6e6e6">publishes its load to OneGate</text>
<line x1="170" y1="110" x2="170" y2="160" stroke="#3b82f6" stroke-width="2"/>
<line x1="170" y1="330" x2="170" y2="480" stroke="#10b981" stroke-width="2"/>
<line x1="450" y1="110" x2="450" y2="160" stroke="#3b82f6" stroke-width="2"/>
<line x1="450" y1="330" x2="450" y2="480" stroke="#10b981" stroke-width="2"/>
<line x1="735" y1="110" x2="735" y2="160" stroke="#3b82f6" stroke-width="2"/>
<line x1="735" y1="330" x2="735" y2="480" stroke="#10b981" stroke-width="2"/>
<line x1="300" y1="250" x2="330" y2="250" stroke="#10b981" stroke-width="2" marker-end="url(#a10b981)"/><text x="315.0" y="244.0" text-anchor="middle" font-size="12" fill="#e6e6e6"></text>
<text x="315" y="238" text-anchor="middle" font-size="11" fill="#e6e6e6">NFS</text>
<line x1="570" y1="250" x2="600" y2="250" stroke="#10b981" stroke-width="2" marker-end="url(#a10b981)"/><text x="585.0" y="244.0" text-anchor="middle" font-size="12" fill="#e6e6e6"></text>
<text x="585" y="238" text-anchor="middle" font-size="11" fill="#e6e6e6">NFS, cache</text>
<line x1="190" y1="380" x2="650" y2="380" stroke="#10b981" stroke-width="2" marker-end="url(#a10b981)"/><text x="420.0" y="374.0" text-anchor="middle" font-size="12" fill="#e6e6e6">SSH from the portal, LDAP lookups from the workers</text>
<text x="450" y="440" text-anchor="middle" font-size="13" fill="#e6e6e6">The storage role asks OneGate which VM is the portal and grants it root on the home export.</text>
<text x="450" y="460" text-anchor="middle" font-size="13" fill="#e6e6e6">OneFlow adds a worker when sessions pass one per worker and retires the oldest empty one.</text>
</svg>